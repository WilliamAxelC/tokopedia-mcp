events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream MCP server definitions
    upstream tokopedia_backend {
        server tokopedia-mcp:3001;
        keepalive 32;
    }

    upstream shopee_backend {
        server shopee-mcp:3000;
        keepalive 32;
    }

    upstream facebook_backend {
        server facebook-marketplace-mcp:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mcp.cuang.dev localhost;

        # Central Gateway Healthcheck
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"mcp.cuang.dev","services":{"tokopedia":"/tokopedia/health","shopee":"/shopee/health","facebook":"/facebook/health"}}';
        }

        # Index / Discovery Overview
        location = / {
            default_type application/json;
            return 200 '{"gateway":"mcp.cuang.dev","mcp_endpoints":{"tokopedia":{"sse":"https://mcp.cuang.dev/tokopedia/sse","messages":"https://mcp.cuang.dev/tokopedia/messages","health":"https://mcp.cuang.dev/tokopedia/health"},"shopee":{"sse":"https://mcp.cuang.dev/shopee/sse","messages":"https://mcp.cuang.dev/shopee/messages","health":"https://mcp.cuang.dev/shopee/health"},"facebook":{"sse":"https://mcp.cuang.dev/facebook/sse","messages":"https://mcp.cuang.dev/facebook/messages","health":"https://mcp.cuang.dev/facebook/health"}}}';
        }

        # -------------------------------------------------------------
        # Tokopedia MCP Server: mcp.cuang.dev/tokopedia/*
        # -------------------------------------------------------------
        location /tokopedia/ {
            proxy_pass http://tokopedia_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tokopedia;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Pass custom user cookie headers (X-Tokopedia-Cookie)
            proxy_pass_request_headers on;
        }

        # -------------------------------------------------------------
        # Shopee MCP Server: mcp.cuang.dev/shopee/*
        # -------------------------------------------------------------
        location /shopee/ {
            proxy_pass http://shopee_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /shopee;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Pass custom user cookie headers (X-Shopee-Cookie)
            proxy_pass_request_headers on;
        }

        # -------------------------------------------------------------
        # Facebook Marketplace MCP Server: mcp.cuang.dev/facebook/*
        # -------------------------------------------------------------
        location /facebook/ {
            proxy_pass http://facebook_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /facebook;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Pass custom user cookie headers (X-Facebook-Cookie)
            proxy_pass_request_headers on;
        }
    }
}
