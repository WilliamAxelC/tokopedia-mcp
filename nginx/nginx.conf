events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream MCP server definitions
    upstream tokopedia_backend {
        server tokopedia-mcp:3001;
        keepalive 32;
    }

    upstream shopee_backend {
        server shopee-mcp:3000;
        keepalive 32;
    }

    upstream facebook_backend {
        server facebook-marketplace-mcp:3000;
        keepalive 32;
    }

    upstream coursera_backend {
        server coursera-mcp:3000;
        keepalive 32;
    }

    upstream s1gate_backend {
        server 10.20.20.11:8000 max_fails=3 fail_timeout=10s;
        server 10.20.20.178:8000 backup;
        keepalive 32;
    }

    server {
        listen 80;
        server_name mcp.cuang.dev localhost;

        # Central Gateway Healthcheck
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"mcp.cuang.dev","services":{"tokopedia":"/tokopedia/health","shopee":"/shopee/health","facebook":"/facebook/health","coursera":"/coursera/health","s1gate":"/s1gate/health"}}';
        }

        # Interactive Web Playground (cuang.dev UI aesthetic)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Index / Discovery Overview
        location = /discovery {
            default_type application/json;
            return 200 '{"gateway":"mcp.cuang.dev","mcp_endpoints":{"tokopedia":{"sse":"https://mcp.cuang.dev/tokopedia/sse","messages":"https://mcp.cuang.dev/tokopedia/messages","health":"https://mcp.cuang.dev/tokopedia/health"},"shopee":{"sse":"https://mcp.cuang.dev/shopee/sse","messages":"https://mcp.cuang.dev/shopee/messages","health":"https://mcp.cuang.dev/shopee/health"},"facebook":{"sse":"https://mcp.cuang.dev/facebook/sse","messages":"https://mcp.cuang.dev/facebook/messages","health":"https://mcp.cuang.dev/facebook/health"},"coursera":{"sse":"https://mcp.cuang.dev/coursera/sse","messages":"https://mcp.cuang.dev/coursera/messages","health":"https://mcp.cuang.dev/coursera/health"},"s1gate":{"sse":"https://mcp.cuang.dev/s1gate/sse","messages":"https://mcp.cuang.dev/s1gate/messages","health":"https://mcp.cuang.dev/s1gate/health"}}}';
        }

        # -------------------------------------------------------------
        # Tokopedia MCP Server: mcp.cuang.dev/tokopedia/*
        # -------------------------------------------------------------
        location /tokopedia/ {
            proxy_pass http://tokopedia_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tokopedia;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Pass custom user cookie headers (X-Tokopedia-Cookie)
            proxy_pass_request_headers on;
        }

        # -------------------------------------------------------------
        # Shopee MCP Server: mcp.cuang.dev/shopee/*
        # -------------------------------------------------------------
        location /shopee/ {
            proxy_pass http://shopee_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /shopee;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Pass custom user cookie headers (X-Shopee-Cookie)
            proxy_pass_request_headers on;
        }

        # -------------------------------------------------------------
        # Facebook Marketplace MCP Server: mcp.cuang.dev/facebook/*
        # -------------------------------------------------------------
        location /facebook/ {
            proxy_pass http://facebook_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /facebook;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Pass custom user cookie headers (X-Facebook-Cookie)
            proxy_pass_request_headers on;
        }

        # -------------------------------------------------------------
        # Coursera MCP Server: mcp.cuang.dev/coursera/*
        # -------------------------------------------------------------
        location /coursera/ {
            proxy_pass http://coursera_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /coursera;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_pass_request_headers on;
        }

        # -------------------------------------------------------------
        # S1Gate Remote MCP Server: mcp.cuang.dev/s1gate/*
        # -------------------------------------------------------------
        location = /s1gate {
            return 301 /s1gate/;
        }

        location /s1gate/ {
            proxy_pass http://s1gate_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /s1gate;

            # Critical Server-Sent Events (SSE) buffering and keepalive configurations
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_next_upstream error timeout invalid_header http_502 http_503;
            proxy_pass_request_headers on;
        }
    }
}
